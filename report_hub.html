
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Reporting Hub | LIFE9</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Favicon and CSS -->
    <link rel="icon" type="image/x-icon" href="image/LIFE9-Logo.png">
    <link rel="stylesheet" href="external/general_stylesheet.css">
    <link rel="stylesheet" href="external/report_hub.css">
    <link rel="stylesheet" href="external/sidebar.css">
</head>
<body>
    <div class="page-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="bi bi-arrow-left" id="toggleIcon"></i>
            </button>
            <div class="logo">
                <a href="index.html"><img src="image/LIFE9-Logo.png" alt="LIFE9 Logo"></a>
                <a href="index.html"><h2>LIFE9</h2></a>
            </div>

            <nav class="menu">
                <a href="dashboard.html" class="menu-item" data-tooltip="Dashboard">
                    <i class="bi bi-clipboard2-check"></i>
                    <span>Dashboard</span>
                </a>
                <a href="quizzes.html" class="menu-item" data-tooltip="Quizzes">
                    <i class="bi bi-controller"></i>
                    <span>Quizzes</span>
                </a>
                <a href="hazard_map.html" class="menu-item" data-tooltip="Hazard Maps">
                    <i class="bi bi-geo-alt"></i>
                    <span>Hazard Maps</span>
                </a>
                <a href="report_hub.html" class="menu-item active" data-tooltip="Report Hub">
                    <i class="bi bi-exclamation-square"></i>
                    <span>Report Hub</span>
                </a>
                <a href="account.html" class="menu-item" data-tooltip="Account">
                    <i class="bi bi-person"></i>
                    <span>Account</span>
                </a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="page-content">
            <div class="report-layout">
                <main class="report-main">
                    <div class="report-content">
                        <h1 class="title-text blue-text barlow-condensed-bold">COMMUNITY REPORTING HUB</h1>
                        <p class="sub-heading red-text">Send Report</p>

                        <form id="report-form">
                            <!-- Disaster and Location -->
                            <div class="form-row">
                                <div class="form-field">
                                    <label for="disaster-type" class="visually-hidden">Natural Disaster</label>
                                    <select id="disaster-type" name="disaster" required>
                                        <option value="" disabled selected>Natural Disaster</option>
                                        <option value="Flood">Flood</option>
                                        <option value="Earthquake">Earthquake</option>
                                        <option value="Cyclone">Cyclone</option>
                                        <option value="Tsunami">Tsunami</option>
                                        <option value="Landslide">Landslide</option>
                                        <option value="Fire">Fire</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label for="report-location" class="visually-hidden">Place</label>
                                    <input type="text" id="report-location" name="location" placeholder="Place and township" required>
                                </div>
                            </div>

                            <!-- Date and Time -->
                            <div class="date-time-row">
                                <div>
                                    <label for="report-date">Date</label>
                                    <input type="date" id="report-date" name="date" required>
                                </div>
                                <div>
                                    <label for="report-time">Time</label>
                                    <input type="time" id="report-time" name="time" required>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="form-field">
                                <label for="report-description" class="visually-hidden">Description</label>
                                <textarea id="report-description" name="description" placeholder="Description" rows="2" required></textarea>
                            </div>

                            <!-- Experience -->
                            <div class="form-field">
                                <label for="report-experience" class="visually-hidden">Your Experience</label>
                                <textarea id="report-experience" name="experience" placeholder="Your Experience" rows="3" required></textarea>
                            </div>

                            <!-- Photo and Submit -->
                            <div class="form-bottom">
                                <label class="upload-label" for="report-photo">
                                    <i class="bi bi-cloud-arrow-up"></i>
                                    <span>Upload a photo <small>(Optional)</small></span>
                                    <input type="file" id="report-photo" name="photo" accept="image/*">
                                </label>
                                <button type="submit" class="submit-btn">Submit <i class="bi bi-arrow-right"></i></button>
                            </div>
                            <p class="form-note">Please provide accurate information to help keep your community informed.</p>
                            <p id="submit-message"></p>
                        </form>
                    </div>
                </main>
            </div>
        </main>
    </div>
    
    <!-- JS -->
    <script src="external/auth.js"></script>
    <script src="external/report-hub.js"></script>
    <script src="external/sidebar.js"></script>
</body>
</html>
