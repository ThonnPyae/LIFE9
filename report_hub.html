
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Reporting Hub | LIFE9</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Favicon and CSS -->
    <link rel="icon" type="image/x-icon" href="image/LIFE9-Logo.png">
    <link rel="stylesheet" href="external/general_stylesheet.css">
    <link rel="stylesheet" href="external/report_hub.css">
</head>
<body>
    <div class="report-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="brand">
                <img src="image/LIFE9-Logo.png" alt="LIFE9 Logo">
                <span class="barlow-condensed-semibold">LIFE9</span>
            </a>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a href="quizzes.html"><i class="bi bi-patch-question"></i> Quizzes</a>
                <a href="hazard-map.html"><i class="bi bi-geo-alt"></i> Hazard Map</a>
                <a href="report-hub.html" class="active"><i class="bi bi-chat-square-text"></i> Report Hub</a>
                <a href="account.html"><i class="bi bi-person"></i> Account</a>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <i class="bi bi-box-arrow-left"></i> Log out
            </button>
        </aside>

        <!-- Main Content -->
        <main class="report-main">
            <div class="report-content">
                <h1 class="title-text blue-text barlow-condensed-bold">COMMUNITY REPORTING HUB</h1>
                <p class="sub-heading red-text">Send Report</p>

                <form id="report-form">
                    <!-- Disaster and Location -->
                    <div class="form-row">
                        <div class="form-field">
                            <label for="disaster-type" class="visually-hidden">Natural Disaster</label>
                            <select id="disaster-type" name="disaster" required>
                                <option value="" disabled selected>Natural Disaster</option>
                                <option value="Flood">Flood</option>
                                <option value="Earthquake">Earthquake</option>
                                <option value="Cyclone">Cyclone</option>
                                <option value="Tsunami">Tsunami</option>
                                <option value="Landslide">Landslide</option>
                                <option value="Fire">Fire</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="report-location" class="visually-hidden">Place</label>
                            <input type="text" id="report-location" name="location" placeholder="Place and township" required>
                        </div>
                    </div>

                    <!-- Date and Time -->
                    <div class="date-time-row">
                        <div>
                            <label for="report-date">Date</label>
                            <input type="date" id="report-date" name="date" required>
                        </div>
                        <div>
                            <label for="report-time">Time</label>
                            <input type="time" id="report-time" name="time" required>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-field">
                        <label for="report-description" class="visually-hidden">Description</label>
                        <textarea id="report-description" name="description" placeholder="Description" rows="2" required></textarea>
                    </div>

                    <!-- Experience -->
                    <div class="form-field">
                        <label for="report-experience" class="visually-hidden">Your Experience</label>
                        <textarea id="report-experience" name="experience" placeholder="Your Experience" rows="3" required></textarea>
                    </div>

                    <!-- Photo and Submit -->
                    <div class="form-bottom">
                        <label class="upload-label" for="report-photo">
                            <span>(Optional) Upload a photo:</span>
                            <input type="file" id="report-photo" name="photo" accept="image/*">
                        </label>
                        <button type="submit" class="submit-btn">Submit</button>
                    </div>
                    <p class="form-note">Please provide accurate information to help keep your community informed.</p>
                </form>
            </div>
        </main>
    </div>

    <script src="external/auth.js"></script>
    <script src="external/report-hub.js"></script>
</body>
</html>
