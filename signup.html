<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Boostrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alice&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Web Favicon -->
    <link rel="icon" type="image/x-icon" href="image/LIFE9-Logo.png">

    <!-- external css -->
    <link rel="stylesheet" href="external/signup.css">
    <link rel="stylesheet" href="external/general_style_sheet.css">

    

</head>
<body>
    <!-- back button -->
    <a href="index.html" class="blue-text "><button class="border-exist blue-border back-btn mt-3 ms-5 mb-3"><i class="bi bi-arrow-left-short pe-2"></i> Back</button></a>
    
    <!-- log in -->
    <div class="container">
        <div class="row border-exist signup-row">
            <div class="col-sm-6 right-side">
                <div class="background-container">
                    <h6 class="para-text white-text">Already have an account?</h6>
                    <a href="login.html" class="red-text"><button type="button" class="btn login-btn white-bg">Login</button></a>
                    <p class="para-text white-text">By creating an account, you will be able to access to various limited features</p>

                </div>
            </div>
            <div class="col-sm-6 left-side mt-2">
                <h3 class="title-text red-text">Sign up</h3>
                <span>
                    <a href="https://www.facebook.com/"><i class="bi bi-facebook footer-media-link red-text"></i></a>
                    <a href="https://web.telegram.org/"><i class="bi bi-telegram footer-media-link red-text"></i></a>
                    <a href="https://x.com/"><i class="bi bi-twitter-x footer-media-link red-text"></i></a>
                </span>
                
                <form id="signup-form">
                    <div class="input-group mt-2">
                        <span class="input-group-text signup-icon"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" id="username-signin" class="form-control signup-input" placeholder="Create a username">
                    </div>
                    <p class="para-text red-text wrong-info-tag" id="w-usename-signup">
                        Your username must be <span id="user-requirement"></span>
                    </p>
                    <div class="input-group mt-2">
                        <span class="input-group-text signup-icon"><i class="bi bi-person-square"></i></span>
                        <input type="text" name="fullname" id="fullname" class="form-control signup-input" placeholder="Full name">
                    </div>
                    <p class="para-text red-text wrong-info-tag" id="no-name-signup">
                        Enter your name.
                    </p>
                    <div class="input-group mt-2">
                        <span class="input-group-text signup-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="password-signin" class="form-control signup-input" placeholder="Password">
                    </div>
                    <p class="para-text red-text wrong-info-tag" id="w-pass-signup">
                        Your password must be <span id="pass-requirement"></span>
                    </p>
                    <p class="para-text red-text wrong-info-tag" id="no-pass-signup">
                        Please create a password longer than 5 characters.
                    </p>
                    <div class="input-group mt-2">
                        <span class="input-group-text signup-icon"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password-cfm-signin" id="password-confirm" class="form-control signup-input" placeholder="Confirm password">
                    </div>
                    <p class="para-text red-text wrong-info-tag" id="w-confirm-signup">
                        Your password do not match
                    </p>
                    <select name="region" id="region" class="mt-2 red-text px-2 py-2">
                        <option value="select">Current Myanmar region</option>
                        <option value="Ayeyarwady">Ayeyarwady Region</option>
                        <option value="Bago">Bago Region</option>
                        <option value="Chin">Chin State</option>
                        <option value="Kachin">Kachin State</option>
                        <option value="Kayah">Kayah State</option>
                        <option value="Kayin">Kayin State </option>
                        <option value="Magway">Magway Region</option>
                        <option value="Mandalay">Mandalay Region </option>
                        <option value="Mon">Mon State</option>
                        <option value="Rakhine">Rakhine State</option>
                        <option value="Sagaing">Sagaing Region </option>
                        <option value="Shan">Shan State</option>
                        <option value="Tanintharyi">Tanintharyi Region</option>
                        <option value="Yangon">Yangon Region</option>
                        <option value="not-Myanmar">I am currently not in Myanmar.</option>
                    </select>
                    <p class="para-text red-text wrong-info-tag" id="w-region-signup">
                        Please select a region
                    </p>
                    <button type="submit" class="btn red-bg white-text signup-btn">Sign up</button>
                </form>
                
            </div>
            
        </div>
    </div>


    <!-- External JS -->
    <script src="external/signup.js"></script>
</body>
</html>
