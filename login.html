
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LIFE9</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="image/LIFE9-Logo.png">

    <!-- External CSS -->
    <link rel="stylesheet" href="external/login.css">
    <link rel="stylesheet" href="external/general_stylesheet.css">
</head>

<body>

    <!-- Back Button -->
    <a href="index.html" class="back-link">
        <button type="button" class="back-btn">
            <i class="bi bi-arrow-left-short"></i> Back
        </button>
    </a>

    <!-- Login Section -->
    <div class="container login-container">
        <div class="row login-row">

            <!-- Left Side -->
            <div class="col-sm-6 left-side">

                <div class="login-content">

                    <h3 class="title-text blue-text">Welcome Back</h3>
                    <p class="para-text login-description">
                        Login to your LIFE9 account to continue.
                    </p>

                    <!-- Social Links -->
                    <div class="social-links">
                        <a href="https://www.facebook.com/" aria-label="Facebook">
                            <i class="bi bi-facebook"></i>
                        </a>
                        <a href="https://web.telegram.org/" aria-label="Telegram">
                            <i class="bi bi-telegram"></i>
                        </a>
                        <a href="https://x.com/" aria-label="X">
                            <i class="bi bi-twitter-x"></i>
                        </a>
                    </div>

                    <!-- Login Form -->
                    <form action="" id="login-form">

                        <div class="input-group login-input-group">
                            <span class="input-group-text login-icon">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="user" id="username-login"
                                class="form-control login-input"
                                placeholder="Username"
                                autocomplete="username"
                                required>
                        </div>

                        <p class="para-text red-text wrong-info-tag" id="w-usename-login">
                            Unavailable username
                        </p>

                        <div class="input-group login-input-group">
                            <span class="input-group-text login-icon">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" name="password" id="password-login"
                                class="form-control login-input"
                                placeholder="Password"
                                autocomplete="current-password"
                                required>
                        </div>

                        <p class="para-text red-text wrong-info-tag" id="w-password-login">
                            Wrong password
                        </p>

                        <button type="submit" class="btn blue-bg white-text login-btn-login">
                            Login <i class="bi bi-arrow-right ms-1"></i>
                        </button>

                    </form>

                    <p class="para-text signup-text">
                        Don't have an account?
                        <a href="signup.html">Sign up</a>
                    </p>

                </div>
            </div>

            <!-- Right Side -->
            <div class="col-sm-6 right-side">

                <div class="background-container">

                    <div class="background-overlay"></div>

                    <div class="background-content">
                        <span class="login-label">LIFE9</span>

                        <h2>Be Prepared.<br>Stay Protected.</h2>

                        <p class="para-text">
                            Building a safer tomorrow starts with being prepared today.
                        </p>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- External JS -->
    <script src="external/login.js"></script>

</body>
</html>
