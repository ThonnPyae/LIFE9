<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Boostrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alice&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Web Favicon -->
    <link rel="icon" type="image/x-icon" href="image/LIFE9-Logo.png">

    <!-- external css -->
    <link rel="stylesheet" href="external/login.css">
    <link rel="stylesheet" href="external/generalstylesheet.css">

    

</head>
<body>
    <!-- back button -->
    <a href="index.html" class="blue-text "><button class="border-exist blue-border back-btn mt-3 ms-5 mb-3"><i class="bi bi-arrow-left-short pe-2"></i> Back</button></a>
    
    <!-- log in -->
    <div class="container">
        <div class="row border-exist login-row">
            <div class="col-sm-6 left-side">
                <h3 class="title-text blue-text">Login</h3>
                <span>
                    <a href="https://www.facebook.com/"><i class="bi bi-facebook footer-media-link red-text"></i></a>
                    <a href="https://web.telegram.org/"><i class="bi bi-telegram footer-media-link red-text"></i></a>
                    <a href="https://x.com/"><i class="bi bi-twitter-x footer-media-link red-text"></i></a>
                </span>
                
                <form action="" id="login-form">
                    <div class="input-group mt-3">
                        <span class="input-group-text login-icon"><i class="bi bi-person"></i></span>
                        <input type="text" name="user" id="username-login" class="form-control login-input" placeholder="Username">
                    </div>
                    <p class="para-text red-text wrong-info-tag" id="w-usename-login">
                        Unavailable username
                    </p>
                    <div class="input-group mt-3">
                        <span class="input-group-text login-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="password-login" class="form-control login-input" placeholder="Password">
                    </div>
                    <p class="para-text red-text wrong-info-tag" id="w-password-login">
                        Wrong password
                    </p>
                    <button type="submit" class="btn blue-bg white-text login-btn-login">Login</button>
                </form>
                
            </div>
            <div class="col-sm-6 right-side">
                <div class="background-container">
                    <h6 class="para-text white-text">Don't have an account?</h6>
                    <a href="signup.html" class="blue-text"><button type="button" class="btn signup-btn white-bg">Sign up</button></a>
                    <p class="para-text white-text">By logging in, you will be able to access various limited features</p>
                </div>
            </div>
        </div>
    </div>


    <!-- External JS -->
    <script src="external/login.js"></script>
</body>
</html>
