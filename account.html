<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | LIFE9</title>
    <!-- Boostrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alice&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Web Favicon -->
    <link rel="icon" type="image/x-icon" href="image/LIFE9-Logo.png">

    <!-- External CSS -->
    <link rel="stylesheet" href="external/general_stylesheet.css">
    <link rel="stylesheet" href="external/sidebar.css">
    <link rel="stylesheet" href="external/account.css">

</head>
<body>
    
    <div class="page-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="bi bi-arrow-left" id="toggleIcon"></i>
            </button>
            <div class="logo">
                <a href="index.html"><img src="image/LIFE9-Logo.png" alt="LIFE9 Logo"></a>
                <a href="index.html"><h2>LIFE9</h2></a>
            </div>

            <nav class="menu">
                <a href="dashboard.html" class="menu-item" data-tooltip="Dashboard">
                    <i class="bi bi-clipboard2-check"></i>
                    <span>Dashboard</span>
                </a>
                <a href="quizzes.html" class="menu-item" data-tooltip="Quizzes">
                    <i class="bi bi-controller"></i>
                    <span>Quizzes</span>
                </a>
                <a href="hazard_map.html" class="menu-item" data-tooltip="Hazard Maps">
                    <i class="bi bi-geo-alt"></i>
                    <span>Hazard Maps</span>
                </a>
                <a href="report_hub.html" class="menu-item" data-tooltip="Report Hub">
                    <i class="bi bi-exclamation-square"></i>
                    <span>Report Hub</span>
                </a>
                <a href="account.html" class="menu-item active" data-tooltip="Account">
                    <i class="bi bi-person"></i>
                    <span>Account</span>
                </a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="page-content">
            <!-- account -->
            <section class="account-section">
                <div class="account-banner">
                    <img src="https://images.unsplash.com/photo-1579267217516-b73084bd79a6?fm=jpg&q=60&w=3000&auto=format&fit=crop" class="account-filler-img" alt="Account page banner">
                    <h1 class="white-text text-center title-text">Account</h1>
                </div>

                <div class="container">
                    <div class="row align-items-center justify-content-center">
                        <div class="col-md-8 my-4 mobile-middle">    
                            <div class="custonmization-container px-5 py-4">
                                <form action="" id="account-form">
                                    <h6 class="para-text red-text">
                                        Username
                                    </h6>
                                    <input type="text" placeholder="" id="existing-username" class="account-input red-border form-control">
                                    <p class="para-text red-text wrong-info-tag" id="w-usename-edited">
                                        Your username must be more than 6 characters.
                                    </p>
                                    <h6 class="para-text red-text">
                                        Full Name
                                    </h6>
                                    <input type="text" placeholder="" id="existing-fullname" class="account-input red-border form-control">
                                    <h6 class="para-text red-text">
                                        Bio
                                    </h6>
                                    <textarea name="bio" id="account-bio" class="account-input red-border form-control"></textarea>
                                    
                                    <h6 class="para-text red-text">
                                        Profile Picture
                                    </h6>
                                    <input type="file" id="profile" accept="image/*" class="account-input mt-3 red-border form-control">
                                    <button type="button" id="remove-profile" class="remove-profile-btn">
                                        <i class="bi bi-trash3"></i> Remove Photo
                                    </button>
                                    <!-- account buttons -->
                                    <div class="account-buttons">
                                        <button type="submit" class="btn blue-bg white-text save-changes-btn">Save Changes</button>
                                        <button type="button" class="btn red-bg white-text logout-btn">Log out <i class="bi bi-box-arrow-right ms-2"></i></button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="col-md-4 my-2 mobile-middle">
                            <h3 class="blue-text title-text">Preview</h3>
                            <div class="preview-container">
                                <div id="profile-container"></div>

                                <div class="info-container">
                                    <h5 class="small-title-text" id="fullname-preview">Full name</h5>
                                    <h6 class="para-text red-text" id="username-preview">Username</h6>
                                    <p class="blue-text para-text" id="bio-preview">Bio</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>


    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

    <!-- External JS -->
    <script src="external/auth.js"></script>
    <script src="external/account.js"></script>
    <script src="external/sidebar.js"></script>
</body>
</html>
